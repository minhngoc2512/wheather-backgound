# Toa do dung de tinh goc mat troi va lay thoi tiet.
# Mac dinh: Ha Noi
[location]
latitude  = 21.0278
longitude = 105.8342

[display]
# Thu muc chua 4 anh nen goc: night / dawn / day / dusk (.jpg .png .webp)
wallpapers = "~/Projects/weather_background/wallpapers"

# auto | gnome | kde | swaybg | feh | none
setter = "auto"

# Do phan giai man hinh. Bo trong de giu nguyen kich thuoc anh goc.
resolution = "2560x1440"

[weather]
# false = bo qua thoi tiet, chi doi anh theo mat troi
enabled = true
