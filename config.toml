# Coordinates used for solar position and the weather lookup.
# Default: Hanoi
[location]
latitude  = 21.0278
longitude = 105.8342

[display]
# Folder holding the base wallpapers, one per time of day (.jpg .png .webp)
wallpapers = "~/Projects/weather_background/wallpapers"

# auto | gnome | kde | swaybg | feh | none
setter = "auto"

# Screen resolution. Leave unset to keep the source image size.
resolution = "2560x1440"

[weather]
# false = ignore weather, follow the sun only
enabled = true
